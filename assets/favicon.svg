    </g>
    <rect x="14.25" y="16.25" width="3.5" height="3.5" rx="0.6" fill="#000"/>
  </mask>
  <g fill="#000" mask="url(#cuts)">
    <path d="M11.5 13V9a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v4z"/>
    <rect x="2.5" y="11.5" width="27" height="17" rx="3"/>
  </g>
</svg>
