<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>toolbox</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body class="tool-page">
    <header class="top">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="https://dayvhwang.com">portfolio</a>
        <span aria-hidden="true">/</span>
        <a href="./"><b>toolbox</b></a>
        <span aria-hidden="true">/</span>
        <span id="crumb" aria-current="page"></span>
      </nav>
      <div class="side">
        <a href="https://github.com/dayvhwang/toolbox" rel="noopener">GitHub</a>
        <div class="theme" role="group" aria-label="Appearance">
          <button type="button" class="plain" data-theme-set="light" aria-pressed="false" title="Light">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">Light</span>
          </button>
          <button type="button" class="plain" data-theme-set="system" aria-pressed="true" title="System">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="3" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">System</span>
          </button>
          <button type="button" class="plain" data-theme-set="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 10.2A5.6 5.6 0 0 1 5.8 3a5.6 5.6 0 1 0 7.2 7.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span class="sr-only">Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main class="stage" id="tool">
      <p class="note">Loading…</p>
    </main>

    <footer class="bottom">
      <nav class="pager" aria-label="Other tools">
        <a class="prev" id="prev" href=""></a>
        <a class="next" id="next" href=""></a>
      </nav>
    </footer>

    <template id="detail">
      <article class="detail">
        <header class="head">
          <b class="name"></b>
          <span class="tagline"></span>
          <p class="description"></p>
          <p class="links"></p>
        </header>
        <a class="hero" href="" target="_blank" rel="noopener" hidden>
          <img alt="" decoding="async" />
        </a>
        <section class="embed" hidden>
          <iframe title="" loading="lazy" allow="clipboard-write; fullscreen; camera; microphone" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
      </article>
    </template>

    <script src="./assets/tool.js" type="module"></script>
  </body>
</html>
