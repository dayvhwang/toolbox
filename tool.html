<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dave's toolbox</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body class="tool-page">
    <header class="top">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="https://dayvhwang.com">portfolio</a>
        <span aria-hidden="true">/</span>
        <a href="./"><b>dave's toolbox</b></a>
        <span aria-hidden="true">/</span>
        <span id="crumb" aria-current="page"></span>
      </nav>
      <a class="side" href="https://github.com/dayvhwang/toolbox" rel="noopener">GitHub</a>
    </header>

    <main class="stage" id="tool">
      <p class="note">Loading…</p>
    </main>

    <footer class="bottom">
      <nav class="pager" aria-label="Other tools">
        <a class="prev" id="prev" href=""></a>
        <a class="next" id="next" href=""></a>
      </nav>
    </footer>

    <template id="detail">
      <article class="detail">
        <header class="head">
          <b class="name"></b>
          <span class="tagline"></span>
          <p class="description"></p>
          <p class="links"></p>
        </header>
        <a class="hero" href="" target="_blank" rel="noopener" hidden>
          <img alt="" decoding="async" />
        </a>
        <section class="embed" hidden>
          <iframe title="" loading="lazy" allow="clipboard-write; fullscreen; camera; microphone" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
      </article>
    </template>

    <script src="./assets/tool.js" type="module"></script>
  </body>
</html>
