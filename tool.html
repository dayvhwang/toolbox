<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dave's toolbox</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body class="tool-page">
    <header class="top">
      <a class="wordmark" href="/">dave's toolbox</a>
      <span class="count crumb" id="crumb"></span>
      <nav class="top-nav" aria-label="Site">
        <a href="/">All tools</a>
        <div class="theme" role="group" aria-label="Appearance">
          <button type="button" data-theme-set="light" aria-pressed="false" title="Light">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">Light</span>
          </button>
          <button type="button" data-theme-set="system" aria-pressed="true" title="System">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="3" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">System</span>
          </button>
          <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 10.2A5.6 5.6 0 0 1 5.8 3a5.6 5.6 0 1 0 7.2 7.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span class="sr-only">Dark</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="page" id="tool">
      <p class="muted">Loading…</p>
    </main>

    <template id="detail">
      <article class="detail">
        <header class="detail-head">
          <div>
            <p class="eyebrow"><span class="kind"></span><span class="year"></span></p>
            <h1 class="name"></h1>
            <p class="tagline"></p>
            <p class="description"></p>
            <p class="tags"></p>
          </div>
          <div class="actions"></div>
        </header>
        <a class="hero" href="" target="_blank" rel="noopener" hidden>
          <img alt="" decoding="async" />
        </a>
        <section class="embed" hidden>
          <div class="embed-bar">
            <span class="embed-url"></span>
            <a class="embed-open" href="" target="_blank" rel="noopener">Open in new tab ↗</a>
          </div>
          <iframe title="" loading="lazy" allow="clipboard-write; fullscreen; camera; microphone" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
        <nav class="pager" aria-label="Other tools">
          <a class="prev" href=""></a>
          <a class="next" href=""></a>
        </nav>
      </article>
    </template>

    <script src="/assets/tool.js" type="module"></script>
  </body>
</html>
