<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dave's toolbox</title>
    <meta name="description" content="Every small tool Dave Hwang has built, in one place. Open source." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="dave's toolbox" />
    <meta property="og:description" content="Every small tool Dave Hwang has built, in one place." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip" href="#grid">Skip to tools</a>

    <header class="top">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="https://dayvhwang.com">portfolio</a>
        <span aria-hidden="true">/</span>
        <a href="./" aria-current="page"><b>dave's toolbox</b></a>
      </nav>
      <a class="side" href="https://github.com/dayvhwang/toolbox" rel="noopener">GitHub</a>
    </header>

    <main class="stage">
      <section class="row" id="grid" aria-label="Tools"></section>
      <section class="row" id="archive" aria-label="Archived tools" hidden></section>
    </main>

    <footer class="bottom">
      <button type="button" class="plain" id="toggle-archive" aria-expanded="false" aria-controls="archive" hidden>Archive</button>
    </footer>

    <template id="item">
      <a class="item" href="">
        <i class="pic"><img alt="" loading="lazy" decoding="async" /></i>
        <span class="name"></span>
        <span class="cat"></span>
      </a>
    </template>

    <script src="./assets/app.js" type="module"></script>
  </body>
</html>
