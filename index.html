<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dave's toolbox</title>
    <meta name="description" content="Every small tool Dave Hwang has built, in one place. Open source." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="dave's toolbox" />
    <meta property="og:description" content="Every small tool Dave Hwang has built, in one place." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip" href="#grid">Skip to tools</a>

    <header class="top">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="https://dayvhwang.com">portfolio</a>
        <span aria-hidden="true">/</span>
        <a href="./" aria-current="page"><b>dave's toolbox</b></a>
      </nav>
      <div class="side">
        <a href="https://github.com/dayvhwang/toolbox" rel="noopener">GitHub</a>
        <div class="theme" role="group" aria-label="Appearance">
          <button type="button" class="plain" data-theme-set="light" aria-pressed="false" title="Light">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">Light</span>
          </button>
          <button type="button" class="plain" data-theme-set="system" aria-pressed="true" title="System">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="3" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="sr-only">System</span>
          </button>
          <button type="button" class="plain" data-theme-set="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 10.2A5.6 5.6 0 0 1 5.8 3a5.6 5.6 0 1 0 7.2 7.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span class="sr-only">Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main class="stage">
      <section class="row" id="grid" aria-label="Tools"><div class="track"><div class="strip"></div></div></section>
      <section class="row" id="archive" aria-label="Archived tools" hidden><div class="track"><div class="strip"></div></div></section>
    </main>

    <footer class="bottom">
      <button type="button" class="plain" id="toggle-archive" aria-expanded="false" aria-controls="archive" hidden>Archive</button>
    </footer>

    <template id="item">
      <a class="item" href="">
        <i class="pic"><img alt="" loading="lazy" decoding="async" /></i>
        <span class="name"></span>
        <span class="cat"></span>
      </a>
    </template>

    <script src="./assets/app.js" type="module"></script>
  </body>
</html>
